name: Uptime — Chatty'ni uyg'oq saqlash

# DIQQAT: avval bu workflow har 5 daqiqada serverni ping qilib, uni 24/7
# uyg'oq ushlab turardi. Natijada Render bepul tarifidagi 750 soatlik kvota
# tez tugab, servis "billing" sababli to'xtatildi (suspended).
#
# Shuning uchun AVTOMATIK JADVAL O'CHIRILDI. Ilova sovuq startda
# "Server uyg'onmoqda…" izohini ko'rsatadi (App.tsx) — bu yetarli.
#
# Agar pulli tarifga o'tsangiz, quyidagi `schedule` qatorini ochib qo'ying:
#   on:
#     schedule:
#       - cron: "*/5 * * * *"

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: /api/health ga so'rov yuborish
        run: |
          url="https://chatty-3eje.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "urinish $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Server uyg'oq."
              exit 0
            fi
            sleep 5
          done
          echo "oxirgi urinish muvaffaqiyatsiz"
          exit 0
